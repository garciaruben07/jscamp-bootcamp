name: 02 - Manual

on:
  workflow_dispatch:
    inputs:
      logging_level:
        description: 'Nivel de log'
        required: true
        default: 'info'
        type: choice
        options:
          - debug
          - info
          - warning
          - error

      environment:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - staging
          - production

      dry_run:
        description: 'Ejecutar sin aplicar cambios'
        required: false
        default: false
        type: boolean

      reason:
        description: 'Motivo de la ejecución'
        required: false
        default: 'Manual execution'
        type: string

permissions:
  contents: read

jobs:
  manual:
    name: Ejecución manual
    runs-on: ubuntu-24.04
    steps:
      # Los inputs se pasan por `env` y se leen como variables de shell. Interpolarlos
      # directamente dentro del `run` inyectaría el texto que escriba el usuario en el
      # script: un `reason` con comillas o un `$(...)` acabaría ejecutándose en el runner
      - name: Mostrar los inputs
        env:
          LOGGING_LEVEL: ${{ inputs.logging_level }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Logging level: $LOGGING_LEVEL"
          echo "Environment:   $ENVIRONMENT"
          echo "Dry run:       $DRY_RUN"
          echo "Reason:        $REASON"

      # `dry_run` está declarado como boolean, así que en el `if` es un booleano de
      # verdad y no hace falta compararlo con la cadena 'true'
      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "Deploying to $ENVIRONMENT"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Dry run: no se aplica ningún cambio en $ENVIRONMENT"
