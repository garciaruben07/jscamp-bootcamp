name: 03 - Schedule

on:
  schedule:
    # ┌───────────── minuto (0 - 59)
    # │ ┌─────────── hora (0 - 23)
    # │ │ ┌───────── día del mes (1 - 31)
    # │ │ │ ┌─────── mes (1 - 12)
    # │ │ │ │ ┌───── día de la semana (0 - 6, domingo = 0)
    # │ │ │ │ │
    # 0 9 * * 1  ->  a las 9:00 de todos los lunes, cualquier día del mes y cualquier mes
    #
    # Dos avisos que no están en el enunciado pero se pagan caros:
    # - GitHub interpreta el cron en UTC, no en la zona del repositorio. En horario de
    #   verano peninsular esto son las 11:00, no las 9:00
    # - las ejecuciones programadas se encolan y pueden arrancar bastante más tarde de
    #   la hora pedida, sobre todo en punto; un minuto no redondo suele entrar antes
    - cron: '0 9 * * 1'

  # Se queda: sin él no hay forma de probar el workflow sin esperar al lunes, y tampoco
  # de relanzarlo el día que la ejecución programada falle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saludar:
    name: Saludar
    runs-on: ubuntu-24.04
    steps:
      - name: Saludar
        run: echo "Hola desde GitHub Actions!"
